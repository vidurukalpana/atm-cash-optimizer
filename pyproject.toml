[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atm-cash-optimizer"
version = "0.1.0"
description = "Bank-side cash planning for ATMs and CRMs: probabilistic forecasting, cost-optimized replenishment, vendor orders and reconciliation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "vidurukalpana" }]
# Lower bounds only for now; pin exact versions once a working set is installed (global rule 11).
dependencies = [
    # Core
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    # Storage / SQL
    "duckdb>=1.0",
    # Validation
    "pandera>=0.20",
    # Big data
    "pyspark>=3.5",
    # Forecasting
    "statsforecast>=1.7",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    # Calendar
    "holidays>=0.50",
    # Optimization / statistics
    "PuLP>=2.8",
    "scipy>=1.12",
    # MLOps
    "mlflow>=2.12",
    "prefect>=2.16",
    "evidently>=0.4",
    # Serving
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    # UI
    "streamlit>=1.33",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atm_cash_optimizer"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "spark: tests that need a local Spark session (Java required)",
    "slow: long-running tests, excluded from the default run",
]
