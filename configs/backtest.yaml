# Backtest (day-by-day replay) parameters.
test_days: 280                   # last N days of each track
warmup_days: 14                  # excluded from metrics
report_horizons: [1, 3, 7, 14]   # horizons shown in forecast metrics

# Parameter values tried for each policy.
sweeps:
  threshold: [0.10, 0.20, 0.30, 0.40, 0.50]
  buffer: [0.10, 0.25, 0.40, 0.60]
  alpha: [0.80, 0.90, 0.95, 0.98]

fixed_schedule_weekday: 0        # 0 = Monday ... 6 = Sunday

sensitivity:
  idle_cash_annual_rate_multipliers: [0.5, 1.0, 1.5]
  visit_fee_multipliers: [0.5, 1.0, 1.5]

seed: 42
